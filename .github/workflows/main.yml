name: Build Supermarket EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            6.0.x

      - name: Build Project
        run: dotnet build --configuration Release

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supermarket-EXE
          path: "**/bin/Release/**"
